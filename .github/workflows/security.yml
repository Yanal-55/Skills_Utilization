name: Security Scanning

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create results directory
        run: |
          mkdir -p security-results

      # =========================
      # BANDIT
      # =========================
      - name: Run Bandit
        continue-on-error: true
        run: |
          echo "===== BANDIT SECURITY SCAN =====" | tee security-results/bandit.txt

          python -m pip install bandit

          bandit -r . -f txt 2>&1 | tee -a security-results/bandit.txt || true

          echo "" | tee -a security-results/bandit.txt
          echo "===== END BANDIT SCAN =====" | tee -a security-results/bandit.txt

      # =========================
      # HADOLINT
      # =========================
      - name: Run Hadolint
        continue-on-error: true
        run: |
          echo "===== HADOLINT DOCKERFILE SCAN =====" | tee security-results/hadolint.txt

          docker pull hadolint/hadolint:latest

          dockerfiles=$(find . -name 'Dockerfile' -type f)

          if [ -z "$dockerfiles" ]; then
            echo "No Dockerfiles found." | tee -a security-results/hadolint.txt
          else
            for dockerfile in $dockerfiles; do

              echo "" | tee -a security-results/hadolint.txt
              echo "========================================" | tee -a security-results/hadolint.txt
              echo "Dockerfile: $dockerfile" | tee -a security-results/hadolint.txt
              echo "========================================" | tee -a security-results/hadolint.txt

              docker run --rm \
                -i \
                hadolint/hadolint:latest \
                < "$dockerfile" 2>&1 | tee -a security-results/hadolint.txt || true

            done
          fi

          echo "" | tee -a security-results/hadolint.txt
          echo "===== END HADOLINT SCAN =====" | tee -a security-results/hadolint.txt

      # =========================
      # TRUFFLEHOG
      # =========================
      - name: Run TruffleHog
        continue-on-error: true
        run: |
          echo "===== TRUFFLEHOG SECRET SCAN =====" | tee security-results/trufflehog.txt

          docker run --rm \
            -v "$PWD:/repo" \
            trufflesecurity/trufflehog:latest \
            filesystem /repo --json 2>&1 | tee -a security-results/trufflehog.txt || true

          echo "" | tee -a security-results/trufflehog.txt
          echo "===== END TRUFFLEHOG SCAN =====" | tee -a security-results/trufflehog.txt

      # =========================
      # DISPLAY RESULTS
      # =========================
      - name: Display security results
        if: always()
        run: |
          echo ""
          echo "########################################"
          echo "#       SECURITY SCAN RESULTS          #"
          echo "########################################"

          echo ""
          echo "========== BANDIT =========="
          cat security-results/bandit.txt || true

          echo ""
          echo "========== HADOLINT =========="
          cat security-results/hadolint.txt || true

          echo ""
          echo "========== TRUFFLEHOG =========="
          cat security-results/trufflehog.txt || true

      # =========================
      # UPLOAD RESULTS
      # =========================
      - name: Upload security results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-results
          path: security-results/
