name: Security Scanning

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create results directory
        run: |
          mkdir -p security-results

      # -------------------------
      # Bandit
      # -------------------------
      - name: Run Bandit
        continue-on-error: true
        run: |
          pip install bandit
          bandit -r . -f txt > security-results/bandit.txt 2>&1 || true

      # -------------------------
      # Hadolint
      # -------------------------
      - name: Run Hadolint
        continue-on-error: true
        run: |
          touch security-results/hadolint.txt

          for dockerfile in $(find . -name 'Dockerfile' -type f); do
            echo "========================================" >> security-results/hadolint.txt
            echo "Dockerfile: $dockerfile" >> security-results/hadolint.txt
            echo "========================================" >> security-results/hadolint.txt

            docker run --rm \
              -i \
              hadolint/hadolint \
              < "$dockerfile" >> security-results/hadolint.txt 2>&1 || true
          done

      # -------------------------
      # TruffleHog
      # -------------------------
           - name: Run TruffleHog
        continue-on-error: true
        run: |
          echo "===== TRUFFLEHOG SECRET SCAN =====" | tee security-results/trufflehog.txt

          docker run --rm \
            -v "$PWD:/repo" \
            trufflesecurity/trufflehog:latest \
            filesystem /repo --json 2>&1 | tee -a security-results/trufflehog.txt || true

          echo "" | tee -a security-results/trufflehog.txt
          echo "===== END TRUFFLEHOG SCAN =====" | tee -a security-results/trufflehog.txt

      # -------------------------
      # Upload all results
      # -------------------------
      - name: Upload security results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-results
          path: security-results/
