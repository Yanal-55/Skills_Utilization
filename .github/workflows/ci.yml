name: Skills Utilization CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create mock .env file for CI
        run: |
          echo "DATABASE_URL=postgresql://user:password@db:5432/skills_db" > .env
          echo "SECRET_KEY=ci_test_secret_key" >> .env

      - name: Validate docker-compose file
        run: docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web Application Image
        run: docker build -t skills-utilization-web:latest .

      - name: Start Database and Vault Services
        run: docker compose up -d db vault

      - name: Verify Running Containers
        run: docker compose ps
