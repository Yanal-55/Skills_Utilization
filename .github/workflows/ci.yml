name: Skills Utilization CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: |
          python3 -m py_compile app.py config.py seed_courses.py
