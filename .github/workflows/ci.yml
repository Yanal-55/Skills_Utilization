name: Skills Utilization CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Python syntax (CI)
        run: |
          python3 -m py_compile app.py config.py seed_courses.py

      - name: Restart Application Service (CD)
        if: github.ref == 'refs/heads/main'
        run: |
          sudo systemctl restart skills-app
