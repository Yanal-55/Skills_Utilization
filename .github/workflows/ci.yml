name: Skills Utilization CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Python syntax (CI)
        run: |
          python3 -m py_compile app.py config.py seed_courses.py

      - name: Create .env file from GitHub Secrets (CD)
        if: github.ref == 'refs/heads/main'
        run: |
          cat <<EOF > .env
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@db:5432/${{ secrets.POSTGRES_DB }}
          SECRET_KEY=your_secret_key
          EOF

      - name: Ensure Vault Directories Exist (CD)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p vault/config vault/data

      - name: Start Containers with Docker Compose (CD)
        if: github.ref == 'refs/heads/main'
        run: |
          docker compose --env-file .env up -d --build

      - name: Restart Application Service (CD)
        if: github.ref == 'refs/heads/main'
        run: |
          sudo systemctl restart skills-app
