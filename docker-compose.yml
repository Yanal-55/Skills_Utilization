services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-skills_utilization}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.17.6
    ports:
      - "8200:8200"
    volumes:
      - ./vault/file:/vault/file
      - ./vault/config:/vault/config
    cap_add:
      - IPC_LOCK
    command: server -config=/vault/config/vault.json
    restart: unless-stopped

  secrets-init:
    image: hashicorp/vault:1.17.6
    container_name: skills-secrets-init
    entrypoint: /bin/sh
    volumes:
      - ./vault_script.sh:/vault_script.sh:ro
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "${VAULT_TOKEN:-hvs.PrPU8wIeAvKnL6rKbTIf4mKu}"
    command:
      - -c
      - |
        apk add --no-cache bash jq curl
        bash /vault_script.sh
    depends_on:
      - vault
    restart: "no"

  web:
    image: ghcr.io/yanal-55/skills_utilization:latest
    ports:
      - "5000:5000"
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "${VAULT_TOKEN:-hvs.PrPU8wIeAvKnL6rKbTIf4mKu}"
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-skills_utilization}"
    depends_on:
      - db
      - secrets-init
    restart: unless-stopped

volumes:
  postgres-data:
