services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-skills_utilization}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    image: ghcr.io/yanal-55/skills_utilization:latest
    ports:
      - "5000:5000"
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "${VAULT_TOKEN:-hvs.PrPU8wIeAvKnL6rKbTIf4mKu}"
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-skills_utilization}"
    depends_on:
      - db
      - secrets-init
    restart: unless-stopped

volumes:
  postgres-data:
