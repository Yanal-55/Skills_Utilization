services:
  db:
    image: postgres:15
    container_name: skills_utilization-db-1
    environment:
      POSTGRES_DB: skills_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skills_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - shared-network
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.17.6
    container_name: skills_utilization-vault-1
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    command: vault server -dev
    ports:
      - "8200:8200"
    networks:
      - shared-network
    restart: unless-stopped

  secrets-init:
    image: hashicorp/vault:1.17.6
    container_name: skills-secrets-init
    entrypoint: /bin/sh
    environment:
      VAULT_ADDR: "http://skills_utilization-vault-1:8200"
      VAULT_TOKEN: "root"
    volumes:
      - ./vault_script.sh:/vault_script.sh:ro
      - ./:/home/aau/Desktop/Skills_Utilization
    command:
      - -c
      - |
        apk add --no-cache bash jq curl
        bash /vault_script.sh
    depends_on:
      vault:
        condition: service_started
    networks:
      - shared-network
    restart: "no"

  web:
    build: .
    container_name: skills_utilization-web-1
    ports:
      - "5000:8080"
    environment:
      - DB_HOST=db
      - POSTGRES_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
      secrets-init:
        condition: service_completed_successfully
    env_file:
      - .env
    networks:
      - shared-network
    restart: always

networks:
  shared-network:
    external: true
